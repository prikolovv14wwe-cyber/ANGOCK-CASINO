<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pickaxe Hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe9f5;--text:#1e2a17;--hot:#d2561a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--text:#eef5e8;--hot:#ff7a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--text:#eef5e8;--hot:#ff7a2a;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;align-items:center;justify-content:center;height:100%}
#stage{--u:1px;position:relative;flex:none;overflow:hidden;touch-action:none;cursor:pointer;background:#5aa0e0;width:960px;height:540px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.px{font-family:"Press Start 2P",monospace}
#logo{position:absolute;left:calc(var(--u)*14);top:calc(var(--u)*10);width:calc(var(--u)*190);pointer-events:none;z-index:2}
#prog{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*6);background:rgba(0,0,0,.25)}
#prog i{display:block;height:100%;width:0;background:#7ef0ff}
#hud{position:absolute;left:0;right:0;top:calc(var(--u)*22);display:flex;justify-content:center;pointer-events:none}
#pot{color:#fff;font-size:calc(var(--u)*12);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #3f3f3f;text-align:center;max-width:52%;line-height:1.6}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:calc(var(--u)*54);color:#ffd34d;text-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 #3f3f3f;pointer-events:none;opacity:0}
#banner.on{animation:ban 1.3s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#hint{position:absolute;left:50%;bottom:calc(var(--u)*80);transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:calc(var(--u)*8) calc(var(--u)*14);font-size:calc(var(--u)*14);pointer-events:none;white-space:nowrap;transition:opacity .4s}

/* ===== Пиксельный интерфейс на экране игры ===== */
.ui{position:absolute;z-index:3;cursor:default}
.mcb{position:relative;border:0;padding:0;background:transparent center/100% 100% no-repeat;image-rendering:pixelated;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
.mcb svg.ic{width:58%;height:58%;image-rendering:pixelated;pointer-events:none}
.mcb:active:not(:disabled) svg.ic,.mcb:active:not(:disabled) .lab{transform:translateY(calc(var(--u)*3))}
.mcb:disabled{filter:grayscale(.85) brightness(.75);cursor:default}
.mcb.on{filter:brightness(1.15) sepia(.35) hue-rotate(60deg)}
.mcb:focus-visible{outline:calc(var(--u)*3) solid #ffd34d;outline-offset:calc(var(--u)*2)}
/* ===== минималистичный интерфейс: слева — настройки и счёт, справа — ставка и кнопка ===== */
.btn{position:relative;border:calc(var(--u)*2) solid #000;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  clip-path:polygon(calc(var(--u)*3) 0,calc(100% - var(--u)*3) 0,100% calc(var(--u)*3),100% calc(100% - var(--u)*3),calc(100% - var(--u)*3) 100%,calc(var(--u)*3) 100%,0 calc(100% - var(--u)*3),0 calc(var(--u)*3))}
.btn svg.ic{width:56%;height:56%;pointer-events:none}
.btn:active:not(:disabled) svg.ic{transform:translateY(calc(var(--u)*2))}
.btn:disabled{filter:grayscale(.9) brightness(.7);cursor:default}
.btn:focus-visible{outline:calc(var(--u)*2) solid #ffd34d}
/* кнопки как в Майнкрафте: серый камень с чёткой фаской, при наведении — фирменный голубой */
.stone{background:#7c7c7c;box-shadow:inset calc(var(--u)*2) calc(var(--u)*2) 0 #b2b2b2,inset calc(var(--u)*-2) calc(var(--u)*-3) 0 #484848}
.stone:hover:not(:disabled){background:#7e88c4;box-shadow:inset calc(var(--u)*2) calc(var(--u)*2) 0 #bcc4f2,inset calc(var(--u)*-2) calc(var(--u)*-3) 0 #4b5386}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.green{background:#5a9e3c center/100% 100% no-repeat;image-rendering:pixelated;box-shadow:inset calc(var(--u)*2) calc(var(--u)*2) 0 rgba(255,255,255,.28),inset calc(var(--u)*-2) calc(var(--u)*-3) 0 rgba(0,0,0,.4)}
.gold{background:#e0b13c;box-shadow:inset calc(var(--u)*2) calc(var(--u)*2) 0 #ffe792,inset calc(var(--u)*-2) calc(var(--u)*-3) 0 #8d6513}
/* окошки как текстовое поле Майнкрафта: чёрное, светло-серая рамка */
.box{background:rgba(0,0,0,.74);border:calc(var(--u)*2) solid #a0a0a0;box-shadow:0 0 0 calc(var(--u)*1) #000;
  display:flex;flex-direction:column;justify-content:center;padding:0 calc(var(--u)*10);
  clip-path:polygon(calc(var(--u)*2) 0,calc(100% - var(--u)*2) 0,100% calc(var(--u)*2),100% calc(100% - var(--u)*2),calc(100% - var(--u)*2) 100%,calc(var(--u)*2) 100%,0 calc(100% - var(--u)*2),0 calc(var(--u)*2))}
.box .lbl{font-size:calc(var(--u)*7);color:#9aa0ab;margin-bottom:calc(var(--u)*4)}
.box .num{font-size:calc(var(--u)*12);color:#fff;white-space:nowrap}
#winV{color:#f5c542}
#leftUI{position:absolute;left:calc(var(--u)*10);bottom:calc(var(--u)*10);display:flex;align-items:flex-end;gap:calc(var(--u)*8);z-index:3}
#leftUI .col{display:flex;flex-direction:column;gap:calc(var(--u)*6)}
#leftUI .btn{width:calc(var(--u)*34);height:calc(var(--u)*34)}
#leftUI .box{width:calc(var(--u)*158);height:calc(var(--u)*34);position:relative}
#bEdit{position:absolute;right:calc(var(--u)*6);top:50%;transform:translateY(-50%);width:calc(var(--u)*18);height:calc(var(--u)*18);background:none;border:0;padding:0;cursor:pointer}
#bEdit svg.ic{width:100%;height:100%}
#rightUI{position:absolute;right:calc(var(--u)*10);bottom:calc(var(--u)*10);display:flex;align-items:center;gap:calc(var(--u)*6);z-index:3}
#rightUI .sm{width:calc(var(--u)*34);height:calc(var(--u)*34)}
#betF{width:calc(var(--u)*150);height:calc(var(--u)*34);align-items:center}
#betF .num{font-size:calc(var(--u)*13)}
#bMain{width:calc(var(--u)*76);height:calc(var(--u)*76);margin-left:calc(var(--u)*4)}
#bMain svg.ic{width:56%;height:56%;margin-top:calc(var(--u)*4)}

.cpBody{padding:calc(var(--u)*36) calc(var(--u)*24) 0}

.cpB:hover{filter:none}.cpB.go:hover{background:#7e88c4;box-shadow:inset calc(var(--u)*2) calc(var(--u)*2) 0 #bcc4f2,inset calc(var(--u)*-2) calc(var(--u)*-3) 0 #4b5386}

/* окна */
#result,#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:5}
#result.show,#modal.show{display:flex}

   Тогда при любой стратегии «забрать на сундуке j» матожидание лестницы = RTP_BASE (93.5%).
   Если раунду не суждено дойти до следующего сундука, где-то на пути поводок начинает рваться:
   он истрёпывается и обрывается вскоре после каждого зацепа (лава резко не поднимается).
   Бонусы (руда, мини-камни, железо) в среднем добавляют ~2–3% → RTP ≈ 96% при уверенной игре.
   Кроме того, любой поводок может порваться, если слишком долго висеть на одном креплении.
   Сундуки стоят всё дальше, лавопадов и TNT всё больше. */

  ARM:.75,                       // ход штока поршня: выезжает на 3/4 блока, шток не отрывается от корпуса
  // Растущая лава: краш с контролем — чем дольше летишь до сундука, тем выше лава. Сундук её остужает.
  lavaRise:.03,lavaRiseGrow:.01, // скорость подъёма (ед./кадр) и прибавка за каждый сундук

  oreHP:{dia:100,eme:140,rub:161,obs:182}, // прочность: рубин на 15% прочнее изумруда, обсидиан на 30% — ломаются только с хорошего разгона
  oreValue:{dia:2,eme:4,obs:6,rub:8},  // алмазный блок +2% ставки, изумрудный +4%, обсидиан +6%, рубин +8% (вдвое дороже изумруда)

function rollChests(){CHEST_AT=CFG.stageLens.map(l=>l+1+[-1,0,0,1,1,2][ri(0,5)]).reduce((a,l)=>{a.push((a[a.length-1]||0)+Math.max(3,l));return a;},[]);}

// ниже горка — старт тяжелее, множители выше. Так высота горки влияет на выплаты, а матожидание остаётся ровным.
const HILLS=[{h:0,p:.25,f:1.06},{h:1,p:.35,f:1},{h:2,p:.25,f:.95},{h:3,p:.15,f:.9}];
let hill=HILLS[1],hillProf=null,islandCols=9,cave=null;
function rollHill(){let r=Math.random();hill=HILLS.find(x=>(r-=x.p)<0)||HILLS[1];
  islandCols=Math.random()<.45?10:9; // иногда остров на блок длиннее вперёд
  hillProf=[];for(let c=0;c<islandCols;c++){const d=Math.abs(c-7);let h=Math.max(0,hill.h-Math.floor(d*rnd(.55,1.1)));if(c<4&&Math.random()<.3)h=Math.min(hill.h+1,h+1);hillProf.push(Math.min(3,h));}
  for(let c=6;c<islandCols;c++)hillProf[c]=hill.h; // площадка под поршнем — он не торчит за край
  // иногда над стартом нависает второй островок — получается пещерка; иногда он держится на каменной колонне
  cave=null;
  if(false&&Math.random()<.45){const cs=ri(3,4),w=ri(2,6-cs),hh=2,top0=380-Math.max(...hillProf.slice(0,cs+w))*IB,bottom=Math.max(top0-ri(115,140),210);
    if(top0-bottom>=90){const drip=[];for(let c=0;c<w;c++)drip.push(Math.random()<.35?1:0);
    cave={cs,w,h:hh,bottom,pillar:Math.random()<.5,drip,mix:Array.from({length:w*hh},()=>Math.random()<.5)};}}
  PB.y=378-hill.h*IB;}
const LAD=i=>Math.round(CFG.ladder[i]*hill.f*100)/100;

function drawReach(){const u=Math.random();let k=0;while(k<CFG.ladder.length&&u<CFG.rtpBase/CFG.ladder[k])k++;return k;}

let AC=null;
function tone(f,d,type='sine',v=.12,slide=0){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

const PAL={W:'#ffffff',w:'#d9dde4',O:'#ffae2b',Y:'#ffe27a',C:'#7fe8f5',c:'#c9f7ff',B:'#8a5527',G:'#5fe06a'};
function iconSVG(rows){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length)),S=Math.max(w,h)+2,ox=Math.floor((S-w)/2),oy=Math.floor((S-h)/2);
  const g=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&(rows[y][x]||'.')!=='.';
  let r='';
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
    if(g(x,y))continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(g(x+dx,y+dy)){r+=`<rect x="${x+ox}" y="${y+oy}" width="1" height="1" fill="#17181d"/>`;dy=dx=2;}
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g(x,y))r+=`<rect x="${x+ox}" y="${y+oy}" width="1" height="1" fill="${PAL[rows[y][x]]||'#fff'}"/>`;
  return `<svg class="ic" viewBox="0 0 ${S} ${S}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
function procIcon(n,f){const rows=[];for(let y=0;y<n;y++){let s='';for(let x=0;x<n;x++)s+=f(x-(n-1)/2,y-(n-1)/2)||'.';rows.push(s);}return rows;}

function pxTex(w,h,P,seed,kind){
  const R=(x,y,ww,hh,f)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="${f}"/>`;
  let sd=seed;const rn=()=>((sd=(sd*16807)%2147483647)/2147483647);
  let r=R(1,0,w-2,h,P.o)+R(0,1,w,h-2,P.o);                      // контур со срезанными углами
  if(kind==='slot'){
    r+=R(1,1,w-2,h-2,P.face);
    for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){const v=rn();if(v<.07)r+=R(x,y,1,1,P.n1);else if(v<.12)r+=R(x,y,1,1,P.n2);}
    r+=R(1,1,w-2,1,P.lo)+R(1,1,1,h-2,P.lo)+R(1,h-2,w-2,1,P.hi)+R(w-2,1,1,h-2,P.hi); // утопленная фаска
    if(P.rv)for(const [x,y] of [[2,2],[w-3,2],[2,h-3],[w-3,h-3]])r+=R(x,y,1,1,P.rv);
  }else{
    r+=R(1,1,w-2,h-2,P.lo);r+=R(1,1,w-2,h-3,P.face);
    for(let y=2;y<h-3;y++)for(let x=2;x<w-2;x++){const v=rn();if(v<.11)r+=R(x,y,1,1,P.n1);else if(v<.2)r+=R(x,y,1,1,P.n2);}
    if(P.top){for(let x=1;x<w-1;x++){const d=1+((x*7+3)%5===0?1:0)+((x*3)%7===0?1:0);r+=R(x,1,1,d+1,P.top);if(rn()<.4)r+=R(x,1,1,1,P.topHi);}}
    r+=R(1,1,w-2,1,P.hi)+R(1,1,1,h-3,P.hi)+R(w-2,2,1,h-4,P.mid);
    r+=R(2,2,1,1,'#ffffffcc');
  }
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' preserveAspectRatio='none' viewBox='0 0 ${w} ${h}' shape-rendering='crispEdges'>${r}</svg>`)}")`;
}

// всё лежит в клетках 40×40: блоки скал, слайм, TNT, мини-камни, крепления — ничего не налезает
const occ=new Map();
const free=(cx,cy)=>!occ.has(key(cx,cy));
const freeAround=(cx,cy,r)=>{for(let x=cx-r;x<=cx+r;x++)for(let y=cy-r;y<=cy+r;y++)if(!free(x,y))return false;return true;};
const cellC=c=>(c+.5)*B;
const ROW_MIN=-54,ROW_MAX=LAVA_ROW-1;
function reserve(cx,cy,r){for(let x=cx-r;x<=cx+r;x++)for(let y=cy-r;y<=cy+r;y++)if(free(x,y))occ.set(key(x,y),'res');}

let oreCount=0;
// остров с туннелем: сверху трава, внутри сквозной проход высотой в 2 блока — можно пролететь насквозь
function buildTunnel(c0,c1,rowMin,rowMax){
  const w=ri(8,12),h=5,x0=ri(c0,Math.max(c0,c1-w)),y0=ri(rowMin,Math.max(rowMin,rowMax-h));
  for(let x=x0-1;x<=x0+w;x++)for(let y=y0-1;y<=y0+h;y++){const o=occ.get(key(x,y));if(o&&o!=='res')return false;}
  const tL=x0+ri(1,2),tR=x0+w-1-ri(1,2);
  for(let x=x0;x<x0+w;x++)for(let y=y0;y<y0+h;y++){
    if(y>=y0+2&&y<=y0+3&&x>=tL&&x<=tR){occ.set(key(x,y),'res');continue;}   // проход
    if(y===y0+h-1&&(x===x0||x===x0+w-1))continue;                           // скруглённые нижние углы
    const ore=y>y0&&Math.random()<.12,type=y===y0?'grass':ore?(Math.random()<.08?'rub':Math.random()<.15?'obs':Math.random()<.4?'eme':'dia'):(Math.random()<.6?'stone1':'stone2');
    cells.set(key(x,y),{cx:x,cy:y,type,iron:type==='stone2'&&Math.random()<.15?'iron':null,ore,hp:ore?CFG.oreHP[type]:1,maxHp:ore?CFG.oreHP[type]:1,decided:false,success:false,value:0,cd:0,crack:0,shake:0});
    occ.set(key(x,y),ore?'ore':'rock');
  }
  return true;
}
function buildRock(c0,c1,rowMin,rowMax,minOre){
  const big=Math.random()<.3,n=big?ri(14,26):ri(5,12),seedX=ri(c0,c1),seedY=ri(rowMin,rowMax); // иногда — большой остров
  if(!free(seedX,seedY))return;
  const shape=[[seedX,seedY]],set=new Set([key(seedX,seedY)]);
  let guard=0;
  while(shape.length<n&&guard++<220){
    const [bx,by]=shape[Math.random()*shape.length|0];
    const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.random()*4|0];
    const nx=bx+d[0],ny=by+d[1],k=key(nx,ny);
    if(nx<c0||nx>c1||ny<rowMin||ny>rowMax||set.has(k)||!free(nx,ny))continue;
    let bad=false;
    for(let x=nx-1;x<=nx+1&&!bad;x++)for(let y=ny-1;y<=ny+1;y++){const o=occ.get(key(x,y));if(o&&o!=='res'&&!set.has(key(x,y))){bad=true;break;}}
    if(bad)continue;
    shape.push([nx,ny]);set.add(k);
  }
  if(shape.length<4)return;
  const r=Math.random();let ores=Math.max(minOre,r<.15?0:r<.55?1:r<.85?2:3); // руды стало больше
  let ix=shape.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,ores);
  // иногда руда лежит горсткой: 2–3 соседних алмазных или изумрудных блока одного вида
  const oreType=()=>{const q=Math.random();return q<.06?'rub':q<.15?'obs':q<.44?'eme':'dia';}; // рубин — редкий
  const veinType=oreType();let vein=null;
  if(Math.random()<(big?.65:.32)&&shape.length>=5){
    const st=shape[ri(1,shape.length-1)],cl=[st],want=Math.random()<.12?ri(4,6):ri(2,3); // иногда большая россыпь 4–6 блоков
    for(let g=0;g<40&&cl.length<want;g++){const b=cl[ri(0,cl.length-1)],[dx,dy]=[[1,0],[-1,0],[0,1],[0,-1]][ri(0,3)];const q=shape.find(([x,y])=>x===b[0]+dx&&y===b[1]+dy&&set.has(key(x,y-1)));if(q&&!cl.includes(q))cl.push(q);}
    if(cl.length>=2){vein=new Set(cl.map(([x,y])=>key(x,y)));ix=[];ores=cl.length;}
  }
  oreCount+=ores;
  shape.forEach(([x,y],i)=>{
    const inVein=vein&&vein.has(key(x,y)),ore=inVein||ix.includes(i),top=!set.has(key(x,y-1)); // верхний блок колонки — трава, как у летающего острова
    const type=inVein?veinType:ore?oreType():top?'grass':(Math.random()<.6?'stone1':'stone2');
    cells.set(key(x,y),{cx:x,cy:y,type,iron:type==='stone2'?(()=>{const r=Math.random();return r<CFG.ironChance?'iron':r<CFG.ironChance+CFG.copperChance?'copper':r<CFG.ironChance+CFG.copperChance+CFG.redChance?'red':null;})():null,ore,hp:ore?CFG.oreHP[type]:1,maxHp:ore?CFG.oreHP[type]:1,decided:false,success:false,value:0,cd:0,crack:0,shake:0});
    occ.set(key(x,y),ore?'ore':'rock');
  });
}
function updateMovers(){
  for(const s of slimes){if(!s.mv)continue;const m=s.mv,ox=s.x,oy=s.y,o=Math.sin(time*m.sp+m.ph)*m.amp;
    if(m.ax==='x')s.x=m.bx+o;else s.y=m.by+o;s.vx=s.x-ox;s.vy=s.y-oy;}
}
// часть слайм-конструкций плавно ездит туда-сюда (влево-вправо или вверх-вниз)
function makeMover(s){
  if(!s||s.pk||Math.random()>.32)return;
  const ax=Math.random()<.5?'x':'y',amp=B*(Math.random()<.5?1:1.5);
  const cx0=Math.floor((s.x-s.w/2)/B),cy0=Math.floor((s.y-s.h/2)/B),wc=s.w/B,hc=s.h/B,r=Math.ceil(amp/B);
  for(let x=cx0-(ax==='x'?r:0);x<cx0+wc+(ax==='x'?r:0);x++)for(let y=cy0-(ax==='y'?r:0);y<cy0+hc+(ax==='y'?r:0);y++){const o=occ.get(key(x,y));if(o&&o!=='res'&&o!=='slime')return;}
  if(ax==='y'&&(s.y+s.h/2+amp>LAVA_Y-6))return;
  for(let x=cx0-(ax==='x'?r:0);x<cx0+wc+(ax==='x'?r:0);x++)for(let y=cy0-(ax==='y'?r:0);y<cy0+hc+(ax==='y'?r:0);y++)if(free(x,y))occ.set(key(x,y),'res');
  s.mv={ax,amp,sp:rnd(.012,.024),ph:rnd(0,6.28),bx:s.x,by:s.y};
}
function addSlimeCells(cx,cy,w,h,pk){
  for(let x=cx;x<cx+w;x++)for(let y=cy;y<cy+h;y++)if(!free(x,y))return false;
  for(let x=cx-1;x<=cx+w;x++)for(let y=cy-1;y<=cy+h;y++){const o=occ.get(key(x,y));if(o&&o!=='res')return false;}
  for(let x=cx;x<cx+w;x++)for(let y=cy;y<cy+h;y++)occ.set(key(x,y),'slime');
  slimes.push({x:cx*B+w*B/2,y:cy*B+h*B/2,w:w*B,h:h*B,sq:0,pk});return true;
}
function placeGem(px,py,e){
  const cx0=Math.floor(px/B),cy0=Math.floor(py/B);
  for(let r=0;r<=2;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
    const cx=cx0+dx,cy=cy0+dy;
    if(cy<ROW_MIN||cy>ROW_MAX||!free(cx,cy))continue;
    occ.set(key(cx,cy),'gem');gems.push({x:cellC(cx),y:cellC(cy),e,ph:Math.random()*6});return true;
  }
  return false;
}
function buildFall(c0,c1,st,rTop){
  for(let t=0;t<(rTop!=null?24:8);t++){
    // ширина потока 1–3 блока; сплошной столб без пауз — только на первом слое
    const fw=rTop!=null?(Math.random()<.7?1:2):(Math.random()<.45?1:Math.random()<.6?2:3),cont=rTop==null&&Math.random()<.35;
    const cx=ri(c0+1,c1-fw),r0=rTop!=null?rTop+ri(-1,1):ri(0,2),eL=ri(0,1),eR=ri(0,1);
    if(pads.some(p=>p.x0>(cx-11)*B&&p.x0<(cx+fw+3)*B))continue; // не ставим лавопад на пути полёта с поршней
    let ok=true;

    for(let y=r0+2;y<=LAVA_ROW&&ok;y++)for(let x=cx-1;x<=cx+fw;x++){const o=occ.get(key(x,y));if(o&&o!=='res'&&o!=='gem'){ok=false;break;}}
    if(!ok)continue;
    gems=gems.filter(g=>!(g.x>(cx-1)*B&&g.x<(cx+fw+1)*B&&g.y>(r0+2)*B));
    // островок-источник разной формы: шире/уже, иногда с выступом снизу
    for(let x=cx-1-eL;x<=cx+fw+eR;x++){
      cells.set(key(x,r0),{cx:x,cy:r0,type:'grass',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,r0),'rock');
      cells.set(key(x,r0+1),{cx:x,cy:r0+1,type:(x>=cx&&x<cx+fw)?'lavasrc':Math.random()<.5?'stone1':'stone2',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,r0+1),'rock'); // блоки лавы-источника
    }
    for(let y=r0+2;y<=LAVA_ROW+1;y++)for(let x=cx-1;x<=cx+fw;x++)if(free(x,y))occ.set(key(x,y),'res');
    const k=1+st*.09;
    falls.push({x:(cx+fw/2)*B,w:fw*B,cont,top:(r0+2)*B,up:rTop!=null,on:Math.random()<.5,timer:ri(10,120),
      onT:Math.round(60*rnd(1.1,1.7)*k),offT:Math.round(60*rnd(1.3,1.9)/k),v:(4.2+st*.35)*SPD,segs:[]});
    return true;
  }

}
function updateFalls(){
  for(const f of falls){

    if(f.up&&!f.seen){if(f.x>camX-40&&f.x<camX+W+40&&f.top>camY-60&&f.top<camY+VIEW_H*zoomF)f.seen=true;else continue;}
    if(f.cont){if(!f.segs.length){f.on=true;f.segs.push({a:f.top,b:f.top});}}           // сплошной поток — льётся без пауз
    else if(--f.timer<=0){f.on=!f.on;f.timer=f.on?Math.round(ri(3,4)*B/f.v):f.offT;if(f.on)f.segs.push({a:f.top,b:f.top});} // капает порциями по 3–4 блока
    const last=f.segs[f.segs.length-1];

    f.segs=f.segs.filter(sg=>sg.a<lavaY);

    for(const sg of f.segs)if(sg.b<lavaY-10&&Math.random()<.08&&Math.abs(f.x-P.x)<W)parts.push({x:f.x+rnd(-14,14),y:sg.b,vx:rnd(-.3,.3),vy:f.v*.9,life:30,max:30,s:3.5,g:.12,lava:1,pop:1}); // капли срываются с головы струи
  }
}
// ===== Островок на лаве с двумя поршнями: коснулся — оба выстреливают и подкидывают кирку к верхнему ярусу =====
let pads=[];
function buildPad(c0,c1,ry=LAVA_ROW-1){ // по умолчанию островок лежит прямо на лаве; наверху — парит
  for(let t=0;t<(ry<LAVA_ROW-1?18:8);t++){
    const cx=ri(c0+1,c1-3);let ok=true;
    // поршень не должен швырять в лавопад: рядом и по ходу полёта столбов лавы нет
    if(falls.some(f=>f.x>(cx-4)*B&&f.x<(cx+11)*B))continue;
    if(pads.some(q=>Math.abs(q.cx-cx)<6))continue;                    // поршни не стоят друг над другом и не мешают друг другу
    if(Math.random()>.02&&!padPathClear(cx,ry))continue;              // над поршнем нет TNT, лавы и блоков (кроме очень редких случаев)
    const eL=ri(0,2),eR=ri(0,2),deep=Math.random()<.45&&ry<LAVA_ROW-1;   // островок с поршнями разной ширины, иногда с «килем» снизу
    for(let x=cx-1-eL;x<=cx+2+eR&&ok;x++)for(let y=ry-2;y<=ry+(deep?2:1);y++){const o=occ.get(key(x,y));if((o&&o!=='res'&&o!=='gem')||(ry<LAVA_ROW-1&&anchors.concat(upAnchors).some(q=>Math.hypot(q.cx-x,q.cy-y)<3))){ok=false;break;}}
    if(!ok)continue;
    for(let x=cx-1-eL;x<=cx+2+eR;x++){
      cells.set(key(x,ry),{cx:x,cy:ry,type:'grass',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,ry),'rock');
      if(x>cx-1-eL||!deep){cells.set(key(x,ry+1),{cx:x,cy:ry+1,type:Math.random()<.5?'stone2':'stone1',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,ry+1),'rock');}
      if(deep&&x>=cx&&x<=cx+1){cells.set(key(x,ry+2),{cx:x,cy:ry+2,type:'stone1',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,ry+2),'rock');}
    }
    gems=gems.filter(g=>!(g.x>(cx-1)*B&&g.x<(cx+3)*B&&g.y>(ry-2)*B&&g.y<(ry+2)*B));
    reservePadPath(cx,ry); // путь вверх свободен — туда ничего не поставят
    pads.push({cx,x0:cx*B,top:(ry-1)*B,t:0,cd:0});
    return true;
  }
  return false;
}
const PKP_VY=12*SPD,PKP_VX=4.1*SPD;
// трасса из 3–4 островков с поршнями: попал на первый — дальше прыгаешь с одного на другой
function buildPadTrail(a){
  const air=2*PKP_VY/(.45*SPD*SPD),d=Math.round(PKP_VX*air/B),n=ri(3,4),ry=LAVA_ROW-1,x0=a.cx+3;
  for(let k=0;k<n;k++){const cx=x0+k*d;for(let x=cx-1;x<=cx+2;x++)for(let y=ry-4;y<=ry+1;y++){const o=occ.get(key(x,y));if(o&&o!=='res'&&o!=='gem')return false;}}
  if(falls.some(f=>f.x>(x0-4)*B&&f.x<(x0+n*d+8)*B))return false;
  for(let k=0;k<n;k++){
    const cx=x0+k*d;
    for(let x=cx-1;x<=cx+2;x++){
      cells.set(key(x,ry),{cx:x,cy:ry,type:'grass',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,ry),'rock');
      cells.set(key(x,ry+1),{cx:x,cy:ry+1,type:'stone2',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,ry+1),'rock');
    }
    for(let x=cx-1;x<=cx+d;x++)for(let y=ry-5;y<=ry-1;y++)if(free(x,y))occ.set(key(x,y),'res');
    pads.push({cx,x0:cx*B,top:(ry-1)*B,t:0,cd:0,pk:k<n-1});
    if(k===n-1)clearAbovePad(cx,ry);
    if(k<n-1)for(const f of [.3,.5,.7]){const t=f*air,gx=(cx+1)*B+PKP_VX*t,gy=(ry-1)*B-20-PKP_VY*t+.45*SPD*SPD*t*t/2;if(Math.random()<.7)placeGem(gx,gy,false);}
  }
  return true;
}
// лестница из поршней: снизу на лаве, следующий — на слой выше и дальше, и так 3–4 ступени.
// Каждый поршень бросает кирку точно на следующий.
function buildPadTower(a){
  const G0=.45*SPD*SPD,n=ri(3,4),dx=6,dh=5,cx0=a.cx+3,ry0=LAVA_ROW-1,steps=[];
  for(let k=0;k<n;k++){
    const cx=cx0+k*dx,ry=ry0-k*dh;
    for(let x=cx-1;x<=cx+2;x++)for(let y=ry-3;y<=ry+1;y++){const o=occ.get(key(x,y));if(o&&o!=='res'&&o!=='gem')return false;}
    if(k>0&&anchors.concat(upAnchors).some(q=>Math.abs(q.cx-cx)<4&&Math.abs(q.cy-ry)<4))return false;
    steps.push({cx,ry});
  }
  if(falls.some(f=>f.x>(cx0-4)*B&&f.x<(cx0+n*dx+6)*B))return false;
  steps.forEach((st,k)=>{
    for(let x=st.cx-1;x<=st.cx+2;x++){
      cells.set(key(x,st.ry),{cx:x,cy:st.ry,type:'grass',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,st.ry),'rock');
      cells.set(key(x,st.ry+1),{cx:x,cy:st.ry+1,type:k===0?'stone2':'stone1',fixed:true,ore:false,cd:0,crack:0,shake:0});occ.set(key(x,st.ry+1),'rock');
    }
    const top=(st.ry-1)*B,pad={cx:st.cx,x0:st.cx*B,top,t:0,cd:0};
    if(k<n-1){
      // рассчитываем бросок: вершина дуги на ~100 выше следующей площадки, приземление ровно на неё
      const nt=(steps[k+1].ry-1)*B,H=(top-nt)+110,vy=Math.sqrt(2*G0*H),T=vy/G0+Math.sqrt(2*110/G0);
      pad.pk=true;pad.vx=dx*B/T;pad.vy=vy;
      for(const f of [.35,.6])placeGem(st.cx*B+B+pad.vx*T*f,top-20-vy*T*f+G0*(T*f)**2/2,false);
    }
    pads.push(pad);
    if(k===n-1)clearAbovePad(st.cx,st.ry);
    for(let x=st.cx-1;x<=st.cx+dx;x++)for(let y=st.ry-dh-3;y<=st.ry-1;y++)if(free(x,y))occ.set(key(x,y),'res');
  });
  return true;
}
// после мощного выброса проверяем, что у вершины траектории есть крепление; если нет — ставим его заранее (вне экрана).
// Исключение — «обрыв» раунда: там креплений не бывает по определению.
function ensureRescue(x,y,vx,vy){
  const G0=.45*SPD*SPD,ta=vy/G0,ax=x+vx*ta,ay=y-vy*vy/(2*G0);
  const gs=gapAt>0&&anchors[gapAt-1]?anchors[gapAt-1].x:Infinity;
  if(ax>gs-120)return;
  const near=anchors.concat(upAnchors).some(q=>Math.abs(q.x-ax)<420&&q.y>ay-60&&q.y<ay+380);
  if(near)return;
  const cx=Math.floor((ax+80)/B),cy=Math.max(-56,Math.floor((ay+170)/B));
  const u={cx,cy,x:cellC(cx),y:cellC(cy),i:segN,up:true,rescue:true};upAnchors.push(u);refreshA();
  for(let xx=cx-1;xx<=cx+1;xx++)for(let yy=cy-1;yy<=cy+1;yy++){const c=cells.get(key(xx,yy));if(c&&!c.fixed){cells.delete(key(xx,yy));}occ.set(key(xx,yy),'res');}
  occ.set(key(cx,cy),'anchor');
}
// столб над поршнем (и чуть вперёд) должен быть пустым: без TNT, блоков, слайма и лавопадов
function padPathClear(cx,ry){
  for(let x=cx-1;x<=cx+4;x++)for(let y=ry-22;y<=ry-2;y++){const o=occ.get(key(x,y));if(o&&o!=='res'&&o!=='gem'&&o!=='pp')return false;}
  if(tnts.some(t=>t.x>(cx-2)*B&&t.x<(cx+6)*B&&t.y<(ry-1)*B))return false;
  return true;
}
// для последнего поршня трассы/лестницы: убираем TNT и камни над ним (если успели появиться раньше) и бронируем путь
function clearAbovePad(cx,ry){
  tnts=tnts.filter(t=>!(t.x>(cx-2)*B&&t.x<(cx+6)*B&&t.y<(ry-1)*B&&t.y>(ry-23)*B));
  for(let x=cx-1;x<=cx+4;x++)for(let y=ry-22;y<=ry-2;y++){const c=cells.get(key(x,y));if(c&&!c.fixed){cells.delete(key(x,y));occ.delete(key(x,y));}}
  reservePadPath(cx,ry);
}
function reservePadPath(cx,ry){
  for(let x=cx-1;x<=cx+4;x++)for(let y=ry-22;y<=ry-1;y++){const o=occ.get(key(x,y));if(!o||o==='res')occ.set(key(x,y),'pp');}
  gems=gems.filter(g=>!(g.x>(cx-1)*B&&g.x<(cx+3)*B&&g.y<(ry-1)*B&&g.y>(ry-6)*B)); // мини-камни прямо на поршне убираем
}
function updatePads(){
  for(const p of pads){
    if(p.cd>0)p.cd--;
    p.t=p.cd>30?Math.min(1,p.t+.34):Math.max(0,p.t-.05);
    if(state!=='run'||p.cd>0||P.x<p.x0-60||P.x>p.x0+2*B+60)continue;
    const yTop=p.top-B*p.t*CFG.ARM;
    if(pickPoints().some(q=>q.x>p.x0&&q.x<p.x0+2*B&&q.y>yTop-6&&q.y<p.top+B)){
      p.cd=60;hook=null;boostT=45;
      let vx=Math.min(7*SPD,Math.max(P.x-P.px,5.5*SPD)),vy=CFG.padLaunch*SPD; // всегда немного вперёд и мощно вверх
      if(p.pk){vx=p.vx||PKP_VX;vy=p.vy||PKP_VY;P.x=p.x0+B;}                                 // поршневая трасса: точный прыжок на следующий островок
      P.y=Math.min(P.y,yTop-20);P.px=P.x-vx;P.py=P.y+vy;
      if(!p.pk)ensureRescue(P.x,P.y,vx,vy); // в верхней точке полёта обязательно будет за что зацепиться
      P.av+=(Math.random()<.5?-1:1)*.25;shake=10;
      for(let k=0;k<2;k++)pixTex(p.x0+B*(k+.5),yTop,T.piston,4,4);

    }
  }
}
function drawPads(){

// удар о лавопад: как от TNT — кирку отбрасывает в сторону, поводок рвётся, затем она падает в лаву

function touchFall(){

function populate(a,b){

      }

      if(ok){makeMover(slimes[slimes.length-1]);break;}
    }
  }
  if(i>=2&&Math.random()<Math.min(.8,CFG.tntChance+st*CFG.tntGrow)){
    for(let t=0;t<10;t++){
      const cx=ri(c0,c1),cy=Math.random()<.5?ri(2,4):ri(7,LAVA_ROW-2);
      if(!freeAround(cx,cy,1))continue;
      occ.set(key(cx,cy),'tnt');tnts.push({x:cellC(cx),y:cellC(cy)});break;

}
// верхний ярус: если запустить кирку высоко, там тоже есть крепления, островки и камни
// любые два крепления (основные и верхние) — не ближе ~4.5 блоков друг к другу
function anchorNear(cx,cy){const r=6.2;for(const q of anchors)if(Math.hypot(q.cx-cx,q.cy-cy)<r)return true;for(const q of upAnchors)if(Math.hypot(q.cx-cx,q.cy-cy)<r)return true;return false;}
function fallsFirst(a,b){
  if(a.i<2)return;
  const st=stageOf(a.i),tops=[-7,-11,-15,-19],pr=[.03,.02,.014,.01]; // лавопады со 2-го слоя и выше — очень редко
  for(let k=0;k<tops.length;k++)if(Math.random()<pr[k]){buildFall(a.cx+3,b.cx-3,st,tops[k]);break;} // лавопад сверху — льётся до самого озера
  const padRows=[0,-4,-8,-12,-16,-20,-24,-28,-32],pp=[.16,.13,.11,.1,.09,.08,.07,.06,.05];
  for(let k=0;k<padRows.length;k++)if(Math.random()<pp[k]){buildPad(a.cx+3,b.cx-4,padRows[k]+ri(-1,1));break;} // парящие поршни на верхних слоях
}
// связность слоёв: у каждого верхнего крепления должно быть крепление ниже в пределах досягаемости поводка,
// иначе до него невозможно добраться — тогда ставим промежуточное крепление между ними
function linkLayers(fromIdx){
  for(let k=fromIdx;k<upAnchors.length;k++){
    const u=upAnchors[k],all=anchors.concat(upAnchors);
    if(all.some(q=>q!==u&&q.y>u.y+60&&Math.hypot(q.x-u.x,q.y-u.y)<430))continue;
    let best=null,bd=1e9;for(const q of all)if(q!==u&&q.y>u.y+60){const d=Math.hypot(q.x-u.x,q.y-u.y);if(d<bd){bd=d;best=q;}}
    if(!best)continue;
    const f=Math.min(.5,380/bd);let cx=Math.round(u.cx+(best.cx-u.cx)*f),cy=Math.round(u.cy+(best.cy-u.cy)*f);
    if(occ.get(key(cx,cy))==='anchor'||anchorNear(cx,cy)&&all.some(q=>Math.hypot(q.cx-cx,q.cy-cy)<3.5))continue;
    const m={cx,cy,x:cellC(cx),y:cellC(cy),i:u.i,up:true,link:true};upAnchors.push(m);refreshA();
    const c=cells.get(key(cx,cy));if(c&&!c.fixed)cells.delete(key(cx,cy));
    occ.set(key(cx,cy),'anchor');
  }
}
function populateUp(a,b){
  const startN=upAnchors.length;
  populateUpInner(a,b);
  for(let r=0;r<3;r++)linkLayers(startN);
}
function populateUpInner(a,b){
  // слои вверх: до ~5–6 «этажей», неровные (центр каждого слоя гуляет), чем выше — тем реже крепления и начинка.
  // Жёсткого потолка нет, генерация просто сходит на нет примерно к 6-му слою.
  if(a.i<1)return;
  const span=b.cx-a.cx,st=stageOf(a.i);
  const LAYERS=[{c:-2,p:.85},{c:-6,p:.75},{c:-10,p:.68},{c:-14,p:.6},{c:-18,p:.53},{c:-22,p:.47},{c:-26,p:.42},{c:-30,p:.37},{c:-34,p:.32},{c:-37,p:.27}]; // креплений меньше — не скапливаются // верхние слои заметно гуще — до них реально долететь // слои ближе друг к другу — с одного дотягиваешься до следующего
  LAYERS.forEach((Ly,li)=>{
    if(Math.random()>Ly.p)return;
    const n=1;
    for(let k=0;k<n;k++){
      for(let t=0;t<14;t++){
        const f=n===1?rnd(.2,.8):k?rnd(.6,.88):rnd(.12,.4);
        const cx=a.cx+Math.round(span*f),cy=Ly.c+ri(-1,1);          // слои слегка неровные, но не налезают друг на друга
        if(!freeAround(cx,cy,1)||anchorNear(cx,cy))continue; // не даём креплениям сбиваться в кучу
        const u={cx,cy,x:cellC(cx),y:cellC(cy),i:a.i,up:true};upAnchors.push(u);refreshA();
        occ.set(key(cx,cy),'anchor');reserve(cx,cy,1);for(let y=cy+2;y<=cy+3;y++)reserve(cx,y,0);
        const L=rnd(150,190);for(let q=0;q<ri(1,2);q++){const an=rnd(-.6,.6);placeGem(u.x+Math.sin(an)*L,u.y+Math.cos(an)*L,Math.random()<.15+li*.03);}
        break;
      }
    }
    const dens=Ly.p;
    if(Math.random()<.85*Math.max(.55,dens))buildRock(a.cx+2,b.cx-2,Ly.c-5,Ly.c+1,0); // слои плотнее — меньше пустот
    if(Math.random()<.3*Math.max(.5,dens))buildRock(a.cx+2,b.cx-2,Ly.c-3,Ly.c+2,0);
    if(Math.random()<.1*Math.max(.5,dens)&&b.cx-a.cx>=12)buildTunnel(a.cx+2,b.cx-2,Ly.c-4,Ly.c+2);
    if(Math.random()<.32*Math.max(.5,dens))for(let t=0;t<8;t++)if(addSlimeCells(ri(a.cx+2,b.cx-5),Ly.c+ri(-1,2),ri(2,3),1,0)){makeMover(slimes[slimes.length-1]);break;}
    if(Math.random()<.035)if(placeGem(rnd(a.x+60,b.x-60),Ly.c*B+rnd(-40,60),false))gems[gems.length-1].sh=true; // щиты попадаются и наверху
    if(Math.random()<(.12+st*.03)*dens)for(let t=0;t<8;t++){const cx=ri(a.cx+2,b.cx-2),cy=Ly.c+ri(-4,0);if(freeAround(cx,cy,1)){occ.set(key(cx,cy),'tnt');tnts.push({x:cellC(cx),y:cellC(cy)});break;}}
    if(Math.random()<.12*dens)buildPad(a.cx+2,b.cx-3,Ly.c+ri(1,2));                 // поршни и на верхних слоях
  });
}
function addAnchor(){
  const last=anchors[anchors.length-1];let cx,cy;
  if(!last){cx=8;cy=ri(2,4);}
  else if(segN===gapAt){cx=last.cx+ri(CFG.gapCells[0],CFG.gapCells[1]);cy=ri(2,4);} // обрыв: следующее крепление слишком далеко
  else{cx=last.cx+ri(CFG.gapMin,CFG.gapMax);let t=0;do{cy=ri(2,4);}while(cy===last.cy&&++t<5);}
  const a={cx,cy,x:cellC(cx),y:cellC(cy),i:segN++};anchors.push(a);
  occ.set(key(cx,cy),'anchor');reserve(cx,cy,1);
  for(let y=cy+2;y<=cy+3;y++)reserve(cx,y,0);
  refreshA();if(last&&a.i!==gapAt){fallsFirst(last,a);populate(last,a);populateUp(last,a);}refreshA(); // верхние лавопады размечаются первыми, чтобы столб до озера был свободен
}
function ensureLevel(){
  const ahead=state==='idle'?W*.95:W+900;
  while(!anchors.length||anchors[anchors.length-1].x<Math.max(P.x,camX)+ahead)addAnchor();
  // всё ценное, что ушло за левый край экрана, исчезает навсегда — вернуться за ним нельзя
  // пропадает только то, от чего кирка ушла далеко вперёд (качания на поводке не считаются)
  const gone=runMaxX-W*.9;
  gems=gems.filter(g=>{if(g.x+20<gone){occ.delete(key(Math.floor(g.x/B),Math.floor(g.y/B)));return false;}return true;});
  for(const c of cells.values())if((c.ore||c.iron)&&(c.cx+1)*B<gone){c.ore=false;c.iron=null;if(c.type==='dia'||c.type==='eme'||c.type==='rub'||c.type==='obs')c.type='stone2';c.crack=0;}
  const cut=camX-700;
  gems=gems.filter(g=>g.x>cut);tnts=tnts.filter(t=>t.x>cut);slimes=slimes.filter(s=>s.x+s.w/2>cut);
  checkpoints=checkpoints.filter(c=>c.x>cut-300||c.i===stageI);
  for(const [k,c] of cells)if(c.cx*B<cut)cells.delete(k);
  falls=falls.filter(f=>f.x>cut);pads=pads.filter(p=>p.x0>cut);upAnchors=upAnchors.filter(a=>a.x>cut-500||a===hook);refreshA();
}
let allA=[];const refreshA=()=>{allA=anchors.concat(upAnchors);};
function newLevel(){

  anchors=[];upAnchors=[];pads=[];cells=new Map();occ.clear();oreCount=0;falls=[];gems=[];tnts=[];slimes=[];checkpoints=[];breaking=[];segN=0;
  rollHill();

  ensureLevel();
}

function pickAnchor(px,py){
  // цепляется за ближайшее крепление ВПЕРЕДИ по ходу полёта и на экране; сзади и снизу — только если впереди ничего нет
  const vx=P.x-P.px,dir=vx<-1?-1:1;let best=null,bs=1e9;
  for(const a of allA){
    const dx=a.x-px,dy=a.y-py,d=Math.hypot(dx,dy);
    if(d>500||a.x<camX-20||a.x>camX+W+20)continue;
    let sc=d;
    if(dx*dir<-30)sc*=2.2;           // позади
    if(dy>60)sc*=1.6;                // заметно ниже кирки
    if(dy<-90&&(P.y-P.py)<-2)sc*=.55; // летишь вверх — предпочитаем крепления выше: так можно подняться на следующий слой
    if(sc<bs){bs=sc;best=a;}
  }
  return best;
}

const solidAt=(cx,cy)=>{const c=cells.get(key(cx,cy));return c&&(c.ore||c.fixed);};

// точный контакт: 31 точка по контуру спрайта кирки проверяется по клеткам.
// Движение за кадр проходится короткими шагами (≤8 ед.), поэтому на скорости кирка не «проскакивает» углы блоков.
function collideAt(v){
  let pts=pickPoints(),solid=false;
  for(const p of pts){
    const c=cells.get(key(Math.floor(p.x/B),Math.floor(p.y/B)));if(!c)continue;
    if(c.fixed){solid=true;continue;}
    if(!c.ore){breakStone(c);v.x*=.96;v.y*=.96;}
    else{const sp=Math.hypot(v.x,v.y);idleT=0;
      if(c.cd<=0&&sp>=CFG.hitMinSpeed){c.cd=10;if(hitOre(c,sp)){v.x*=.75;v.y*=.75;}else solid=true;}else solid=true;} // прижатие без разгона не ломает
  }
  if(!solid)return false;
  let hitAny=false;
  for(let it=0;it<3;it++){
    pts=pickPoints();let px=0,py=0;
    for(const p of pts){
      const cx=Math.floor(p.x/B),cy=Math.floor(p.y/B);if(!solidAt(cx,cy))continue;
      const l=solidAt(cx-1,cy)?1e9:p.x-cx*B,r=solidAt(cx+1,cy)?1e9:(cx+1)*B-p.x,
            t=solidAt(cx,cy-1)?1e9:p.y-cy*B,b=solidAt(cx,cy+1)?1e9:(cy+1)*B-p.y;
      const m=Math.min(l,r,t,b);if(m>=1e9)continue;
      if(m===l)px=Math.min(px,-(l+.6));else if(m===r)px=Math.max(px,r+.6);
      else if(m===t)py=Math.min(py,-(t+.6));else py=Math.max(py,b+.6);
    }
    if(!px&&!py)break;
    hitAny=true;P.x+=px;P.y+=py;
    {const a=P.ang-Math.PI/4,c=Math.cos(a),sn=Math.sin(a),mx=P.x+COM[0]*c-COM[1]*sn;
     // опора снизу: если центр тяжести вне точки опоры — тяжёлая сторона перевешивает
     if(py<0){let sx=0,n=0;for(const p of pickPoints()){if(solidAt(Math.floor(p.x/B),Math.floor((p.y+2)/B))){sx+=p.x;n++;}}if(n)P.av+=(mx-sx/n)*.0016;}
     if(px)P.av+=-Math.sign(px)*Math.min(.12,Math.abs(v.y)*.012);}
    if(px&&v.x*px<0)v.x=-v.x*.45;
    if(py&&v.y*py<0)v.y=-v.y*.45;
  }
  if(hitAny)P.av*=.7;
  return hitAny;
}
function sweptNear(tx,ty,r){
  if(pickPoints().some(p=>Math.abs(p.x-tx)<r&&Math.abs(p.y-ty)<r))return true;
  const ox=P.x,oy=P.y;P.x=(P.x+P.px)/2;P.y=(P.y+P.py)/2;const hit=pickPoints().some(p=>Math.abs(p.x-tx)<r&&Math.abs(p.y-ty)<r);P.x=ox;P.y=oy;pickPoints();return hit;
}
function collideBlocks(){
  const ox=P.px,oy=P.py,ex=P.x,ey=P.y,v={x:ex-ox,y:ey-oy};
  const n=Math.max(1,Math.ceil(Math.hypot(v.x,v.y)/8));
  for(let k=1;k<=n;k++){
    P.x=ox+(ex-ox)*k/n;P.y=oy+(ey-oy)*k/n;
    if(collideAt(v))break;
  }
  P.px=P.x-v.x;P.py=P.y-v.y;
}

  time++;updateClouds();updateTransition();updateFalls();updatePads();for(let i=booms.length-1;i>=0;i--)if(++booms[i].t>28)booms.splice(i,1);
  if(shieldT>0&&state==='run'){shieldT--;if(time%3===0){const an=Math.random()*6.28,r=rnd(12,26);parts.push({x:P.x+Math.cos(an)*r,y:P.y+Math.sin(an)*r,vx:rnd(-.2,.2),vy:-rnd(.4,.9),life:34,c:['#b28cff','#d9c6ff','#8a5cff'][time%3],s:3,g:-.004,spell:1});}}updateMovers();if(boostT>0)boostT--;
  // лава «плюётся» как в Майнкрафте: яркая капля взлетает, остывает и гаснет, у поверхности — дымок
  if(Math.random()<.07)parts.push({x:camX+Math.random()*W,y:lavaY,vx:(Math.random()-.5)*1.6,vy:-(3.5+Math.random()*4),life:70,max:70,s:4.5,g:.16,lava:1,pop:1});
  if(Math.random()<.04)parts.push({x:camX+Math.random()*W,y:lavaY-4,vx:(Math.random()-.5)*.4,vy:-(.5+Math.random()*.6),life:80,c:'#3b3b3b',s:5,g:-.004,smoke:1});
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=p.img?.97:.985;p.life--;
    if(p.pop){const f=p.life/p.max;p.c=f>.7?'#fff0a0':f>.45?'#ffb22e':f>.2?'#e8641a':'#8a2a0c';p.s=Math.max(1.5,4.5*(.4+.6*f));
      if(time%6===0&&f<.8)parts.push({x:p.x,y:p.y,vx:0,vy:-.35,life:22,c:'#4a4a4a',s:2.5,g:-.01,smoke:1});}
    if((p.lava||p.img)&&p.vy>0&&p.y>lavaY){if(p.pop)parts.push({x:p.x,y:lavaY-3,vx:0,vy:-.5,life:30,c:'#555',s:4,g:-.01,smoke:1});p.life=0;}}
  parts=parts.filter(p=>p.life>0);
  for(const f of floaters){f.y-=f.e?.6:1.1;f.life--;}
  floaters=floaters.filter(f=>f.life>0);
  for(const s of slimes)s.sq*=.86;
  for(const c of cells.values()){if(c.cd>0)c.cd--;if(c.shake>0)c.shake--;}
  shake*=.86;flash*=.85;

  P.lx=P.x;P.ly=P.y;P.la=P.ang;
  // анимация поршня
  if(pistonPh==='push'){
    pistonT=Math.min(1,pistonT+.2);putOnPiston();
    if(pistonT>=1){pistonPh='back';const v=Math.hypot(6.5,12.5)*SPD;P.px=P.x-PDX*v;P.py=P.y-PDY*v;P.av=.1;tone(90,.2,'sawtooth',.08,-30);}
    else return;
  }else if(pistonPh==='back'){pistonT=Math.max(0,pistonT-.04);if(pistonT<=0)pistonPh='idle';}
  if(state==='idle'){putOnPiston();return;} // кирка лежит на поршне
  for(const b of breaking)b.t++;
  breaking=breaking.filter(b=>{if(b.t>=7){pixTex(cellC(b.cx),cellC(b.cy),T[TEX_OF[b.type]],5,3);return false;}return true;});
  // уровень лавы
  if(state==='run'){
    if(lavaCool>0){lavaCool--;lavaY+=(LAVA_Y-lavaY)*.06;}
    else lavaY=Math.max(CFG.lavaTop,lavaY-(CFG.lavaRise+Math.max(0,stageI+1)*CFG.lavaRiseGrow));
    if(lavaY<LAVA_Y-150&&time%50===0)tone(55,.4,'sawtooth',.05,-10);
  }else if(state==='idle')lavaY=LAVA_Y;
  if(state==='over'&&(P.y>lavaY+80||pistonPh==='idle'&&P.x===restPos(0).x))return;
  if(slowT>0){slowT--;if(slowT%2)return;}

  let vx=(P.x-P.px)*.999,vy=(P.y-P.py)*.999+G;
  if(P.y>lavaY){vx*=.8;vy=vy*.75+.15;}
  if(hook){
    hookT++;ropeLen+=(ropeTarget-ropeLen)*.07;
    if(state==='run'){
      // поводок рвётся только от долгого безделья: удары по блокам и отскоки сбрасывают счётчик
      idleT++;
      if(idleT>ropeLimit&&Math.random()<.012)snapRope();
      else if(idleT>ropeLimit-90&&idleT%30===0)tone(140,.12,'triangle',.05,-40); // поводок поскрипывает
    }
    if(hook){const dx=P.x-hook.x,dy=P.y-hook.y,d=Math.hypot(dx,dy)||1;
    if(d>=ropeLen-1){const tx=-dy/d,ty=dx/d,tv=vx*tx+vy*ty;vx+=tx*Math.sign(tv)*PUMP;vy+=ty*Math.sign(tv)*PUMP;}}
  }
  const sp=Math.hypot(vx,vy),VMAX=(boostT>0?40:26)*SPD;if(sp>VMAX){vx*=VMAX/sp;vy*=VMAX/sp;}
  P.px=P.x;P.py=P.y;P.x+=vx;P.y+=vy;
  if(hook){
    const dx=P.x-hook.x,dy=P.y-hook.y,d=Math.hypot(dx,dy)||1;
    if(d>ropeLen){const nx=hook.x+dx/d*ropeLen,ny=hook.y+dy/d*ropeLen;P.x+=(nx-P.x)*.92;P.y+=(ny-P.y)*.92;}
  }
  // живая физика: центр тяжести смещён к алмазной головке.
  // На поводке кирка висит головкой вниз и качается как маятник; в полёте вращается по инерции.
  if(hook&&state==='run'){
    const a=P.ang-Math.PI/4,c=Math.cos(a),sn=Math.sin(a);
    const hx=P.x+GRIP[0]*c-GRIP[1]*sn,hy=P.y+GRIP[0]*sn+GRIP[1]*c;      // точка обвязки на рукояти
    const mx=P.x+COM[0]*c-COM[1]*sn,my=P.y+COM[0]*sn+COM[1]*c;          // центр тяжести
    const want=Math.atan2(hy-hook.y,hx-hook.x),cur=Math.atan2(my-hy,mx-hx);
    let d=want-cur;d=Math.atan2(Math.sin(d),Math.cos(d));

  }else P.av*=.996;
  P.av=Math.max(-.32,Math.min(.32,P.av));
  if(P.y>lavaY)P.av*=.9;
  P.ang+=P.av;

  if(state==='run'||state==='dead'){
    // слайм по контуру кирки: какая точка вошла глубже — от той грани и отскок
    const pts=pickPoints();
    for(const s of slimes){
      if(Math.abs(P.x-s.x)>s.w/2+40||Math.abs(P.y-s.y)>s.h/2+40)continue;
      const L0=s.x-s.w/2,R0=s.x+s.w/2,T0=s.y-s.h/2,B0=s.y+s.h/2;
      let px=0,py=0;
      for(const p of pts){
        if(p.x<=L0||p.x>=R0||p.y<=T0||p.y>=B0)continue;
        const l=p.x-L0,r=R0-p.x,t=p.y-T0,b=B0-p.y,m=Math.min(l,r,t,b);
        if(m===t)py=Math.min(py,-(t+.5));else if(m===b)py=Math.max(py,b+.5);else if(m===l)px=Math.min(px,-(l+.5));else px=Math.max(px,r+.5);
      }
      if(!px&&!py)continue;
      let bvx=P.x-P.px,bvy=P.y-P.py;
      P.x+=px;P.y+=py;
      if(py<0){if(s.pk){bvy=-PK_VY;bvx=PK_VX;}else bvy=-Math.max(Math.abs(bvy),CFG.slimeBounce*SPD);}
      else if(py>0)bvy=Math.max(Math.abs(bvy),5*SPD);
      if(px)bvx=Math.sign(px)*Math.max(Math.abs(bvx),9*SPD);
      if(s.mv){bvx+=s.vx||0;bvy+=s.vy||0;} // движущийся слайм передаёт своё движение
      P.px=P.x-bvx;P.py=P.y-bvy;s.sq=1;idleT=0;
      pixTex(P.x,P.y,T.slime,3,2);
      tone(s.pk?240:180,.22,'sine',.16,s.pk?340:260);
    }
  }
  if(state==='run'){
    runT++;
    if(P.x>runMaxX)runMaxX=P.x;

      const g=gems[i];

        addBonus(g.e?CFG.miniEmeV:CFG.miniDiaV,g.x,g.y,false);
        pix(g.x,g.y,g.e?BLOCK_COLS.eme:BLOCK_COLS.dia,10,4);

      }
    }
    for(const t of tnts){

      if(sweptNear(t.x,t.y,21)){explode(t);break;}
    }
    for(const c of checkpoints){
      if(!c.passed&&P.x>c.x){
        c.passed=true;stageI=c.i;slowT=40;lavaCool=90;stageStartT=runT; // сундук остужает лаву
        if(stageI<CFG.ladder.length-1)openPrompt();

        else{deathBy='lava';burnInLava();state='dead';hook=null;lose();}}
      else hud();
    }
  }
  if(state==='dead'&&P.y+8>lavaY){burnInLava();lose();}
}

/* ===== Экран 16:9 ===== */
function layout(){
  const app=$('app');
  let w=app.clientWidth-16,h=w*9/16;const ah=app.clientHeight-16;if(h>ah){h=ah;w=h*16/9;}
  w=Math.max(200,Math.floor(w));h=Math.max(112,Math.floor(h));
  stage.style.width=w+'px';stage.style.height=h+'px';stage.style.setProperty('--u',(h/600)+'px');
  DPR=Math.min(1.75,window.devicePixelRatio||1);
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
  stageH=h;applyZoom();
}

function drawPiston(){
  if(!ready(T.piston))return;
  const t=pistonT;
  ctx.save();ctx.translate(PB.x,PB.y);ctx.rotate(PTH);
  if(t>.01&&ready(T.pistonArm)){
    ctx.drawImage(T.pistonArm,-PS/2,-PS/2-PS*t*CFG.ARM,PS,PS);              // шток с головкой выезжает, не отрываясь от корпуса
    ctx.drawImage(T.piston,0,4,16,12,-PS/2,-PS/2+PS*4/16,PS,PS*12/16);       // корпус без головки
  }else ctx.drawImage(T.piston,-PS/2,-PS/2,PS,PS);
  ctx.restore();
}
IB=64; // блоки острова крупнее
// остров собирается одной картинкой по пикселям: без краевых линий текстуры — стыков между блоками не видно
const islandCache={};
function buildIslandTex(cols,rows,prof){
  const src=document.createElement('canvas');src.width=src.height=16;const sg=src.getContext('2d');sg.drawImage(T.grass,0,0);
  const d=sg.getImageData(0,0,16,16).data,px=(x,y)=>{const o=(y*16+x)*4;return [d[o],d[o+1],d[o+2]];};
  const dirt=[];for(let y=8;y<15;y++)for(let x=1;x<15;x++)dirt.push(px(x,y));
  let seed=21;const rn=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const mh=Math.max(0,...(prof||[0])),W=cols*16,H=(rows+mh)*16,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),id=g.createImageData(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const top=(mh-(prof?prof[Math.floor(x/16)]||0:0))*16,yy=y-top;if(yy<0)continue;   // горка: у каждой колонки своя высота
    let col;
    if(yy<8){const tx=1+(x%14),p=px(tx,yy);col=(yy<6||p[1]>p[0]+20)?p:dirt[(rn()*dirt.length)|0];}
    else col=dirt[(rn()*dirt.length)|0];
    const o=(y*W+x)*4;id.data[o]=col[0];id.data[o+1]=col[1];id.data[o+2]=col[2];id.data[o+3]=255;
  }
  g.putImageData(id,0,0);c.mh=mh;return c;
}

  if(!ready(T.grass)){ctx.fillStyle='#6a4a2a';ctx.fillRect(x0,y0,cols*IB,rows*IB);return;}
  const k=cols+'x'+rows+(prof?prof.join(''):'');if(!islandCache[k])islandCache[k]=buildIslandTex(cols,rows,prof);
  const tc=islandCache[k];

// ===== Поводок как в Майнкрафте: витая верёвка из чередующихся коричневых звеньев =====
const LEAD={o:'#24170b',a:'#8b5e34',b:'#5f3d1e',h:'#b98a55'};
function drawLead(x0,y0,cx,cy,x1,y1){
  // поводок Майнкрафта: квадратная в сечении верёвка — одна грань светлая, другая тёмная, и через звено они меняются местами
  const len=Math.hypot(x1-x0,y1-y0),n=Math.max(8,Math.round(len/7)),pt=t=>{const u=1-t;return [u*u*x0+2*u*t*cx+t*t*x1,u*u*y0+2*u*t*cy+t*t*y1];};
  const P0=[];for(let i=0;i<=n;i++)P0.push(pt(i/n));
  for(let i=0;i<n;i++){
    const [ax,ay]=P0[i],[bx,by]=P0[i+1],dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy)||1,nx=-dy/d*1.6,ny=dx/d*1.6,odd=i%2;
    ctx.fillStyle=odd?'#5b3c22':'#8a6038';ctx.beginPath();ctx.moveTo(ax+nx,ay+ny);ctx.lineTo(bx+nx,by+ny);ctx.lineTo(bx,by);ctx.lineTo(ax,ay);ctx.fill();
    ctx.fillStyle=odd?'#8a6038':'#3f2915';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(bx-nx,by-ny);ctx.lineTo(ax-nx,ay-ny);ctx.fill();
  }
}
// узел на креплении — маленький «кубик» поводка, как на заборе в Майнкрафте
function drawLeadKnot(x,y,k){
  if(k<=0)return;
  const s=2,m=['.aaaa.','abbbba','acaaca','abbbba','acaaca','.cccc.'],P={a:'#8a6240',b:'#6b4a2e',c:'#4e331d'};
  ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(.7+.3*k,.7+.3*k);
  m.forEach((r,yy)=>[...r].forEach((v,xx)=>{if(v==='.')return;ctx.fillStyle=P[v];ctx.fillRect((xx-3)*s,(yy-3)*s+4,s,s);}));
  ctx.restore();
}
// витки вокруг рукояти: рисуются в системе координат спрайта кирки, появляются по очереди
function drawLeadWrap(k){
  const sc=PICK_S/128,c=n=>[(n[0]-64)*sc,(n[1]-64)*sc];
  const turns=[.22,.3].slice(0,Math.ceil(k*2));
  for(const t of turns){
    const [x,y]=c([64*t+4,127-63*t-4]);
    ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/4);

        // текстура течёт вниз быстрее самой струи — видно, что лава льётся, как в Майнкрафте
        pat.setTransform(new DOMMatrix([kk,0,0,kk,0,(time*f.v*1.6)%B]));
        // квадратные блоки лавы, как текущая лава в Майнкрафте: порция = ровно 3–4 блока, края прямые
        const FW=f.w||B;ctx.fillStyle=pat;const L0=f.x-FW/2;
        ctx.fillRect(L0,a,FW,b-a);
        ctx.fillStyle='rgba(110,25,0,.3)';ctx.fillRect(L0,a,2.5,b-a);ctx.fillRect(L0+FW-2.5,a,2.5,b-a);   // тёмные боковые грани
        if(!f.cont){ctx.fillStyle='rgba(255,220,120,.25)';ctx.fillRect(L0,b-2.5,FW,2.5);}                // светлая кромка снизу у «головы»
        ctx.fillStyle=pat;
      }
      // капли у истока
    }
  }
  for(const b of booms){ // анимация взрыва: вспышка-звезда → огненный шар → кольцо дыма
    const f=Math.min(3,Math.floor(b.t/6)),sz=f===0?B*2.2:B*5,al=f===3?Math.max(0,1-(b.t-18)/10):1;
    if(ready(T.boom)){ctx.globalAlpha=al;ctx.drawImage(T.boom,f*64,0,64,64,b.x-sz/2,b.y-sz/2,sz,sz);ctx.globalAlpha=1;}
  }
  for(const t of tnts){
    if(t.dead||t.x<L||t.x>R)continue;
    tex(T.tnt,t.x-20,t.y-20,40,40,'#d33'); // TNT остаётся прежнего размера
    if(state==='run'&&Math.hypot(t.x-P.x,t.y-P.y)<150&&(time>>3)%2){ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(t.x-20,t.y-20,40,40);}
  }

  // точка крепления — середина рукояти (там обматывается поводок)
  const ha=ra-Math.PI/4,hc=Math.cos(ha),hs=Math.sin(ha),HX=(21-64)*PICK_S/128,HY=(106-64)*PICK_S/128;
  const gx=rx+HX*hc-HY*hs,gy=ry+HX*hs+HY*hc;
  if(hook){
    const k=Math.min(1,(hookT+alpha)/6),ex=gx+(hook.x-gx)*k,ey=gy+(hook.y-gy)*k;
    const d=Math.hypot(hook.x-rx,hook.y-ry),sag=Math.max(0,ropeLen-d)*.6;
    drawLead(gx,gy,(gx+ex)/2,(gy+ey)/2+sag,ex,ey);
    if(k>=1)drawLeadKnot(hook.x,hook.y,Math.min(1,(hookT-6+alpha)/6));
  }

  if(!(state==='over'&&deathBy&&P.y>lavaY+55)){
    ctx.save();ctx.translate(rx,ry);ctx.rotate(ra-Math.PI/4);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    tex(charred&&ready(T.charred)?T.charred:T.pick,-PICK_S/2,-PICK_S/2,PICK_S,PICK_S,'#6ef');
    ctx.imageSmoothingEnabled=false;
    if(hook)drawLeadWrap(Math.min(1,(hookT+alpha)/10)); // витки поводка вокруг рукояти
    ctx.restore();
    if(shieldT>0){ // щит в стиле Майнкрафта: эффект «зачарования» на кирке + частицы зелья + иконка эффекта с таймером
      if(!glintCv){glintCv=document.createElement('canvas');glintCv.width=glintCv.height=128;}
      const g=glintCv.getContext('2d');g.globalCompositeOperation='source-over';g.clearRect(0,0,128,128);g.drawImage(T.pick,0,0);
      g.globalCompositeOperation='source-atop';const off=(time*2.2)%256-128;
      g.fillStyle='rgba(150,90,255,.55)';for(let k=-2;k<3;k++){g.save();g.translate(off+k*96,0);g.rotate(-.6);g.fillRect(-10,-40,22,240);g.restore();}
      g.fillStyle='rgba(120,60,230,.18)';g.fillRect(0,0,128,128);
      ctx.save();ctx.translate(rx,ry);ctx.rotate(ra-Math.PI/4);ctx.imageSmoothingEnabled=true;ctx.drawImage(glintCv,-PICK_S/2,-PICK_S/2,PICK_S,PICK_S);ctx.imageSmoothingEnabled=false;ctx.restore();
      const left=Math.ceil(shieldT/60),blink=shieldT<60&&(time>>3)%2;
      if(!blink&&ready(T.shield)){ctx.drawImage(T.shield,Math.round(rx-22),Math.round(ry-50),18,18);
        ctx.font='10px "Press Start 2P",monospace';ctx.textAlign='left';ctx.textBaseline='middle';
        ctx.fillStyle='#3f3f3f';ctx.fillText('0:0'+left,Math.round(rx-1),Math.round(ry-40));ctx.fillStyle='#ffffff';ctx.fillText('0:0'+left,Math.round(rx-2),Math.round(ry-41));}
    }
  }

  // лава из твоей гифки (35 кадров) — одной заливкой-паттерном вместо десятков отрисовок
  const lf=Math.floor(time*DT/70)%35,bottom=camY+VIEW_H*zoomF+60;
  if(ready(T.lava)){
    if(!lavaPat.length){const LS=T.lava.naturalWidth;for(let f=0;f<35;f++){const c=document.createElement('canvas');c.width=c.height=LS;c.getContext('2d').drawImage(T.lava,0,f*LS,LS,LS,0,0,LS,LS);lavaPat.push(ctx.createPattern(c,'repeat'));}}
    const pat=lavaPat[lf],k=B/(T.lava.naturalWidth);
    pat.setTransform(new DOMMatrix([k,0,0,k,0,0]));
    ctx.fillStyle=pat;ctx.imageSmoothingEnabled=true;ctx.fillRect(L-B,lavaY,R-L+2*B,bottom-lavaY);
  }else{ctx.fillStyle='#d4560c';ctx.fillRect(L-B,lavaY,R-L+2*B,bottom-lavaY);}
  ctx.imageSmoothingEnabled=false;

  for(const p of parts){
    ctx.globalAlpha=p.smoke?Math.min(.5,p.life/80):p.img?Math.min(.55,p.life/30):Math.min(1,p.life/18); // осколки полупрозрачные
    if(p.img){const s=p.s*Math.min(1,.4+p.life/40);ctx.drawImage(p.img,p.sx,p.sy,p.ss,p.ss,Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);}
    else if(p.spell){ctx.fillStyle=p.c;const x=Math.round(p.x),y=Math.round(p.y);ctx.fillRect(x-1,y-3,2,6);ctx.fillRect(x-3,y-1,6,2);} // частица зелья — пиксельный «плюсик»
    else{ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x-p.s/2),Math.round(p.y-p.s/2),p.s,p.s);}
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floaters){
    ctx.globalAlpha=Math.min(1,f.life/25);
    ctx.font=(f.e?16:f.dmg?9:11)+'px "Press Start 2P",monospace';
    ctx.fillStyle=f.grey?'#d0d0d0':f.dmg?'#ff6b5a':f.e?'#ffd34d':'#7ef0ff';ctx.fillText(f.t,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(flash>.02){ctx.fillStyle='rgba(255,255,255,'+(flash*.7)+')';ctx.fillRect(0,0,cw,ch);}
  drawTransition(cw,ch);
}

let acc=0;
function loop(t){
  const dt=Math.min(100,t-lastFrame);lastFrame=t;
  if(promptT>0){promptT-=dt/1000;$('cpBar').style.width=Math.max(0,promptT/5*100)+'%';$('cpSec').textContent=Math.ceil(Math.max(0,promptT));if(promptT<=0)closePrompt();}
  acc+=dt*(promptT>0?.06:1); // пока решаешь — время почти стоит
  while(acc>=DT){step();acc-=DT;}
  alpha=acc/DT;
  draw(dt);requestAnimationFrame(loop);
}
layout();camX=P.x-W*.32;camY=55;newLevel();initClouds();
hintEl.style.opacity=0;
hud();ui();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
if(window.AG&&AG.on)AG.balance().then(b=>{bal=b;save();ui();}).catch(e=>AG.err(e));
requestAnimationFrame(loop);
})();
</script>
